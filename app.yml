apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: django-demo
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/Soumyadeepjana1/gitops-django.git  # Replace it with your forked repo
    targetRevision: master
    path: app.yml
  destination:
    server: https://192.168.49.2:8443   # Replace with your Cluster Url, To get run: `argocd cluster list`
    namespace: default
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    

apiVersion: apps/v1
kind: Deployment

metadata:
  name: django-demo

spec:
  replicas: 2

  selector:
    matchLabels:
      app: django-demo

  template:
    metadata:
      labels:
        app: django-demo

    spec:
      containers:
        - name: nginx
          image: nginx:stable-alpine
          imagePullPolicy: Always

          ports:
            - containerPort: 80

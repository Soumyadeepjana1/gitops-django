apiVersion: apps/v1
kind: Deployment

metadata:
  name: django-demo

spec:
  replicas: 2

  selector:
    matchLabels:
      app: django-demo

  template:
    metadata:
      labels:
        app: django-demo

    spec:
      containers:
        - name: django-demo
          image: soumyadeep7872/django-demo:tagname

          ports:
            - containerPort: 8000

          imagePullPolicy: Always
